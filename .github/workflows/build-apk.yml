name: Construire l'APK

on:
  push:
    branches: [ main, preparation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clé de signature (secrets GitHub)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/verhaeghe-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/verhaeghe-release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe Verhaeghe"
          else
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signature/verhaeghe-release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe Verhaeghe (fichier du dépôt)"
          fi

      - name: Compiler l'APK et le bundle Play Store
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD || 'bWx625uvClOv0PIN6mbXPEri' }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Renommer
        run: |
          cp app/build/outputs/apk/release/app-release.apk Verhaeghe-Irrigation.apk
          cp app/build/outputs/bundle/release/app-release.aab Verhaeghe-Irrigation.aab
          sha256sum Verhaeghe-Irrigation.apk | tee Verhaeghe-Irrigation.apk.sha256
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs Verhaeghe-Irrigation.apk | tee signature.txt
          grep -q "Verhaeghe" signature.txt || (echo "::error::APK non signé avec la clé Verhaeghe" && exit 1)

      - name: Garder les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Verhaeghe-Irrigation-${{ github.ref_name }}
          path: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
            Verhaeghe-Irrigation.apk.sha256

      - name: Publier la version (branche main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Verhaeghe Irrigation – dernière version
          body: |
            APK construit automatiquement depuis le commit ${{ github.sha }}.
            Téléchargez Verhaeghe-Irrigation.apk sur le téléphone Android puis ouvrez-le pour l'installer.
          files: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
          make_latest: true

      - name: Version de test (branche preparation, non publiée aux téléphones)
        if: github.ref_name == 'preparation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preparation
          name: Version de test (non publiée)
          prerelease: true
          make_latest: false
          body: |
            Version de test construite depuis la branche preparation (${{ github.sha }}).
            Elle n'est pas proposée en mise à jour dans l'appli.
          files: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
            Verhaeghe-Irrigation.apk.sha256

      # ---- Dépôt public de distribution (le code source peut rester privé) ----
      - name: Distribution publique – version officielle
        if: github.ref_name == 'main' && env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: simonpst02-beep/verhaeghe-irrigation-maj
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: derniere-version
          name: Verhaeghe Irrigation – dernière version
          body: Version officielle de l'application Verhaeghe Irrigation (APK Android).
          files: Verhaeghe-Irrigation.apk
          make_latest: true

      - name: Distribution publique – version bêta
        if: github.ref_name == 'preparation' && env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: simonpst02-beep/verhaeghe-irrigation-maj
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: beta
          name: Verhaeghe Irrigation – version bêta
          prerelease: true
          make_latest: false
          body: Version de test de l'application Verhaeghe Irrigation.
          files: Verhaeghe-Irrigation.apk

      - name: Distribution publique – fichiers de version et licences
        if: env.DIST_TOKEN != ''
        run: |
          git clone -q "https://x-access-token:${DIST_TOKEN}@github.com/simonpst02-beep/verhaeghe-irrigation-maj.git" dist
          if [ "${{ github.ref_name }}" = "main" ]; then cp version.json dist/; else cp version-beta.json dist/; fi
          [ -f licences.json ] && cp licences.json dist/ || true
          cd dist
          git config user.name "Verhaeghe Irrigation (build)"; git config user.email "build@verhaeghe-irrigation.invalid"
          git add -A
          git diff --cached --quiet || (git commit -qm "Mise à jour depuis ${{ github.ref_name }} (${GITHUB_SHA::7})" && git push -q)
