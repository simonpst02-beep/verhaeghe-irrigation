name: Construire l'APK

on:
  push:
    branches: [ main, preparation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clé de signature (secrets GitHub)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/verhaeghe-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/verhaeghe-release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe Verhaeghe"
          else
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signature/verhaeghe-release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe Verhaeghe (fichier du dépôt)"
          fi

      - name: Compiler l'APK et le bundle Play Store
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD || 'bWx625uvClOv0PIN6mbXPEri' }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Renommer
        run: |
          cp app/build/outputs/apk/release/app-release.apk Verhaeghe-Irrigation.apk
          cp app/build/outputs/bundle/release/app-release.aab Verhaeghe-Irrigation.aab
          sha256sum Verhaeghe-Irrigation.apk | tee Verhaeghe-Irrigation.apk.sha256
          unzip -p Verhaeghe-Irrigation.apk META-INF/*.RSA >/dev/null 2>&1 || true
          keytool -printcert -jarfile Verhaeghe-Irrigation.apk | grep -q "Verhaeghe" || (echo "::error::APK non signé avec la clé Verhaeghe" && exit 1)

      - name: Garder les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Verhaeghe-Irrigation-${{ github.ref_name }}
          path: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
            Verhaeghe-Irrigation.apk.sha256

      - name: Publier la version (branche main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Verhaeghe Irrigation – dernière version
          body: |
            APK construit automatiquement depuis le commit ${{ github.sha }}.
            Téléchargez Verhaeghe-Irrigation.apk sur le téléphone Android puis ouvrez-le pour l'installer.
          files: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
          make_latest: true

      - name: Version de test (branche preparation, non publiée aux téléphones)
        if: github.ref_name == 'preparation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preparation
          name: Version de test (non publiée)
          prerelease: true
          make_latest: false
          body: |
            Version de test construite depuis la branche preparation (${{ github.sha }}).
            Elle n'est pas proposée en mise à jour dans l'appli.
          files: |
            Verhaeghe-Irrigation.apk
            Verhaeghe-Irrigation.aab
            Verhaeghe-Irrigation.apk.sha256
