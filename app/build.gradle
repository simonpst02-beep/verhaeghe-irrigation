plugins { id 'com.android.application' }

// Signature fixe : la clé est fournie par les secrets GitHub (SIGNING_KEY / SIGNING_PASSWORD).
// Sans secrets, la clé fixe du dossier signature/ est utilisée : toutes les versions ont la même signature.
def ksFile = file(System.getenv('KEYSTORE_FILE') ?: 'none.jks')
def ksPass = System.getenv('SIGNING_PASSWORD')

android {
    namespace 'fr.verhaeghe.irrigation'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.verhaeghe.irrigation'
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName '2.4'
    }
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'verhaeghe'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (!(ksFile.exists() && ksPass)) throw new GradleException('Clé de signature Verhaeghe introuvable : construction arrêtée (jamais de clé de test).')
            signingConfig signingConfigs.release
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
